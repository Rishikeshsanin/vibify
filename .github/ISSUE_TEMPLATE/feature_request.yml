name: Feature request
description: Suggest an improvement to the shared-listening experience
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Start with the user problem, not just the feature.
      placeholder: Guests cannot currently add songs to the room queue...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add a host-controlled setting that lets guests submit tracks...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback / synchronization
        - Music search / queue
        - Room / participants
        - Mobile experience
        - UI / UX
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs or alternatives
      description: Mention complexity, browser limitations, or other approaches if relevant.
  - type: checkboxes
    id: principle
    attributes:
      label: Product fit
      options:
        - label: This directly improves shared listening or room reliability.
          required: true
